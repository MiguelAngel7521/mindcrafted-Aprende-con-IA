# Verify the application and build a playable, explicitly non-AI-approved demo.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Check Python syntax
        run: python -m compileall -q mindcrafted
      - name: Check all tracked JavaScript syntax
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          scripts = [path for path in files if path.endswith((".js", ".cjs", ".mjs"))]
          for path in scripts:
              subprocess.run(["node", "--check", path], check=True)
          print(f"Syntax verified: {len(scripts)} JavaScript files")
          PY
      - name: Run complete test suite including browser E2E
        run: python -m pytest -q --junitxml=output/ci/tests.xml
      - name: Build and verify playable World V2 campaign
        run: python -m mindcrafted.generator.world_tools check --boss-demo 3 --output output/ci/boss-campaign
      - name: Check whitespace and tracked-file integrity
        run: |
          git diff --check
          git diff --exit-code
      - name: Retain test results and development campaign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindcrafted-ci-evidence
          path: output/ci/
          if-no-files-found: warn

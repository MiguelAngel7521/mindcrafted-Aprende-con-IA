# Verify packaging build only when this repo is configured as a Python package.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel (when package metadata exists)
        run: |
          if [[ -f pyproject.toml || -f setup.py ]]; then
            pip install build
            python -m build
            ls -la dist/
          else
            echo "No pyproject.toml/setup.py found; skipping package build."
          fi
